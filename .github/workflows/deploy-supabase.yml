name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # PINNED ON PURPOSE - do not change back to `latest`.
      #
      # `version: latest` makes the action call the GitHub releases API on every
      # run to resolve what "latest" means. On 2026-08-04 that call failed with
      # "Failed to resolve latest Supabase CLI release: rate limit exceeded",
      # which failed the whole deploy at step 3 before any migration or function
      # shipped (run 30884372602, attempt 1). A plain re-run went green, so
      # nothing was actually wrong with the code - the deploy path for the
      # checkout/webhook money-path functions was simply one GitHub API rate
      # limit away from failing at 2am.
      #
      # A pinned version is fetched directly and needs no resolution call.
      # 2.111.0 is the exact stable release `latest` resolved to when this was
      # pinned, so this is behaviour-neutral. Bump deliberately when there is a
      # reason to, and re-run the workflow to confirm the new version deploys.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      # Idempotent (IF NOT EXISTS) — safe to run on every deploy. Must run
      # BEFORE the email functions deploy, since they query these columns.
      - name: Apply email dedup migration
        run: |
          SQL=$(jq -Rs . < supabase/migrations/20260709000001_email_dedup_columns.sql)
          curl -sf -X POST "https://api.supabase.com/v1/projects/yzdtevrwystezhbmgcwn/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $SQL}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Idempotent (IF NOT EXISTS) — safe to run on every deploy. Must run
      # BEFORE the webhook/admin functions deploy, since they read/write this column.
      - name: Apply vehicle_key migration
        run: |
          SQL=$(jq -Rs . < supabase/migrations/20260715000001_vehicle_key_column.sql)
          curl -sf -X POST "https://api.supabase.com/v1/projects/yzdtevrwystezhbmgcwn/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $SQL}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Idempotent (IF NOT EXISTS) — safe to run on every deploy. Must run
      # BEFORE the webhook/admin functions deploy, since they read/write the
      # deposit + payment-intent columns.
      - name: Apply deposit columns migration
        run: |
          SQL=$(jq -Rs . < supabase/migrations/20260723000001_deposit_columns.sql)
          curl -sf -X POST "https://api.supabase.com/v1/projects/yzdtevrwystezhbmgcwn/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $SQL}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Idempotent (ADD COLUMN IF NOT EXISTS + CREATE OR REPLACE) — safe to run
      # on every deploy. Must run BEFORE the follow-up function deploys, since
      # that function writes bookings.followup_sent_at.
      - name: Apply follow-up selector fix
        run: |
          SQL=$(jq -Rs . < supabase/migrations/20260804000001_fix_followup_selector.sql)
          curl -sf -X POST "https://api.supabase.com/v1/projects/yzdtevrwystezhbmgcwn/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $SQL}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Config Function
        run: supabase functions deploy config --project-ref yzdtevrwystezhbmgcwn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Checkout Function
        run: supabase functions deploy checkout --project-ref yzdtevrwystezhbmgcwn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Webhook Function
        run: supabase functions deploy webhook --project-ref yzdtevrwystezhbmgcwn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Admin Function
        run: supabase functions deploy admin --project-ref yzdtevrwystezhbmgcwn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Pickup Reminders Function
        run: supabase functions deploy send-pickup-reminders --project-ref yzdtevrwystezhbmgcwn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Return Instructions Function
        run: supabase functions deploy send-return-instructions --project-ref yzdtevrwystezhbmgcwn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Mid-Rental Checkins Function
        run: supabase functions deploy send-mid-rental-checkins --project-ref yzdtevrwystezhbmgcwn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Health Check Function
        run: supabase functions deploy health-check --project-ref yzdtevrwystezhbmgcwn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy ID Upload Function
        run: supabase functions deploy id-upload --project-ref yzdtevrwystezhbmgcwn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # leads (FIRST10 new-visitor codes) and follow-up (COMEBACK10 repeat-customer
      # code) were previously manual-deploy-only, which is why the Stripe-API promo
      # bug in both went undeployed/unnoticed. Added to CI so their fixes ship and
      # future changes auto-deploy like the others.
      - name: Deploy Leads Function
        run: supabase functions deploy leads --project-ref yzdtevrwystezhbmgcwn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Follow-up Function
        run: supabase functions deploy follow-up --project-ref yzdtevrwystezhbmgcwn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
